[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govharness"
version = "0.22.0"
description = "Read-only query layer and custodian's toolkit for the governance corpus"
readme = "README.md"
requires-python = ">=3.11"
# Standard library only (records/dependencies.md); z3 is optional and
# found at run time when importable.
dependencies = []

[project.scripts]
govharness = "govharness.cli.main:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["govharness*"]
